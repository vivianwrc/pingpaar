<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pingpaar</title>
<meta name="description" content="Eure gemeinsame App für Dates, Erinnerungen, Wünsche und euren Pinguin Kiesel.">
<meta name="theme-color" content="#fbf7f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pingpaar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{height:100%}html{touch-action:manipulation;-webkit-text-size-adjust:100%}button,a,label,.story,.story *{touch-action:manipulation}.story{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
</head>
<body>

<style>
/* Layout: one phone column, one view at a time, menu behind the three-line button. Palette "Polarrosé", light only: warm cream ground, dusty blue surfaces, old rose for love and main actions, aubergine-grey ink. Palatino throughout. */
:root{
  --bg:#fbf7f2; --paper:#ffffff; --ice:#eef2f5; --sky:#dce5ec; --blue:#557389;
  --pink:#d9a6a9; --pink-deep:#b0656d; --pink-soft:#f6e7e6;
  --ink:#3b3640; --muted:#77717d; --line:#ede7e0;
  --on-pink:#3b3640; --deep:#ebe6ee; --deep-ink:#6a5a78; --on-sky:#2c3a46;
  --land:#fdfbf8; --water:#dce5ec; --road:#f0ebe4; --park:#e6ecdd;
  --pg:#2e2a33; --belly:#ffffff; --beak:#e9b46a;
  --shadow:0 2px 10px rgb(59 54 64 / .06);
  --f:"Palatino","Palatino Linotype","Book Antiqua","URW Palladio L","P052",Georgia,serif;
  color-scheme:light;
}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}

.app{height:100%;max-width:440px;margin:0 auto;display:grid;grid-template-rows:auto 1fr;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 6px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:6px}
.logo .peek{width:40px;height:38px;display:block}
.logo .peek svg{width:100%;height:100%;display:block}
.logo b{font-size:24px;font-weight:700;letter-spacing:.01em}
.logo b span{color:var(--pink-deep)}
.icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:19px;height:19px}

.pager{position:relative;overflow:hidden;min-height:0}
.page{height:100%;overflow-y:auto;padding-block:6px 30px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:4px}
.page-head h2{font-size:27px;line-height:1.1}
.page-head p{margin:3px 0 0;color:var(--muted);font-size:14px}

.card{background:var(--paper);border-radius:22px;padding:18px;border:1px solid var(--line);min-width:0}
.label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.example{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:1px 7px;border-radius:999px;white-space:nowrap}
.btn{border:0;background:var(--ice);border-radius:999px;padding:9px 16px;font-weight:700;font-size:15px;white-space:nowrap}
.btn.pink{background:var(--pink);color:var(--on-pink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:#c4384b}
.link{border:0;background:none;color:var(--blue);font-weight:700;font-size:14px;padding:4px 0}
.seg{display:flex;gap:4px;background:var(--ice);padding:4px;border-radius:999px;align-self:flex-start;max-width:100%;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}

/* menu */
.top{position:relative;z-index:35;background:var(--bg)}
.menu-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--ink);padding:0}
.menu-btn svg{width:20px;height:20px}
.top .spacer{width:40px}
.menu{position:absolute;left:0;right:0;top:100%;background:var(--paper);border-bottom:1px solid var(--line);border-radius:0 0 24px 24px;padding-block:6px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr 1fr;gap:4px;box-shadow:0 18px 30px rgb(34 37 43 / .10);animation:drop .18s ease-out}
@keyframes drop{from{transform:translateY(-8px);opacity:0}}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:14px;padding:11px 12px;font-size:15.5px;text-align:left;color:var(--ink)}
.menu button svg{width:20px;height:20px;flex:none;color:var(--muted)}
.menu button[aria-current="page"]{background:var(--bg);font-weight:700}
.menu button[aria-current="page"] svg{color:var(--ink)}
.menu .wide{grid-column:1/-1;border-top:1px solid var(--line);border-radius:0;margin-top:4px;padding-top:14px}
.scrim{position:absolute;inset:0;z-index:30;background:rgb(34 37 43 / .18)}
@media (prefers-reduced-motion:reduce){.menu{animation:none}}

/* HOME */
.couple{--av:clamp(68px,12.5svh,124px);display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:4px;padding-top:2px}
#p-home{gap:clamp(6px,1.4svh,14px);padding-block:0 8px}
#p-home .card{padding:clamp(12px,1.9svh,18px)}
.person{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,.9svh,8px);min-width:0}
.avatar{width:min(34vw,var(--av,128px));aspect-ratio:1;border-radius:50%;overflow:hidden;border:4px solid var(--paper);box-shadow:var(--shadow);background:var(--ice);display:grid;place-items:center;padding:0;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar .ini{font-size:46px;font-weight:700;color:var(--blue)}
.person.p .avatar{background:var(--pink-soft)}
.person.p .avatar .ini{color:var(--pink-deep)}
.avatar .cam{position:absolute;left:0;right:0;bottom:12%;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.person .nm{font-weight:700;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mood{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--paper);border-radius:999px;padding:4px 12px 4px 4px;font-size:13.5px;font-weight:700;box-shadow:var(--shadow);max-width:100%}
.mood.add{padding:6px 12px;color:var(--blue)}
.mood{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood.ro{cursor:default}
.mood svg{width:26px;height:26px;flex:none}
.heart-btn{margin-top:calc(min(34vw,var(--av)) / 2 - 26px);width:52px;height:52px;border-radius:50%;border:0;background:var(--pink-deep);color:#fff;display:grid;place-items:center;box-shadow:0 4px 14px rgb(176 101 109 / .3);transition:transform .12s}
.heart-btn:active{transform:scale(.9)}
.heart-btn svg{width:26px;height:26px}
.fly{position:absolute;pointer-events:none;color:var(--pink-deep);z-index:40;animation:fly 1.3s ease-out forwards}
.fly svg{width:100%;height:100%}
@keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-170px) scale(1.2);opacity:0}}
.together{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.together .big{font-size:clamp(28px,4.4svh,40px);font-weight:700;line-height:1.05;color:var(--pink-deep);font-variant-numeric:tabular-nums}
.together .sub{color:var(--muted);font-size:14.5px}
.together .quote{margin:clamp(6px,1svh,10px) 0 0;padding-top:clamp(6px,1svh,10px);border-top:1px solid var(--line);width:100%;font-style:italic;font-size:15.5px;line-height:1.35;color:var(--muted)}
.distance{background:var(--sky);color:var(--on-sky);padding:16px 16px 14px;border-color:transparent}
.distance svg.route{display:block;width:100%;height:clamp(44px,8.5svh,92px);overflow:visible}
.distance .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.distance .row span{font-weight:700;font-size:14.5px}
.distance .row b{font-size:clamp(19px,3svh,24px);font-variant-numeric:tabular-nums}
.next{display:grid;grid-template-columns:50px 1fr;gap:14px;align-items:center}
.datebox{border-radius:14px;text-align:center;padding:5px 0;line-height:1.05;color:#fff}
.datebox b{display:block;font-size:24px}
.datebox span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.next strong{display:block;font-size:17px;overflow-wrap:anywhere}
.next small{color:var(--muted);font-size:13.5px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* FOOD */
.mapcard{padding:0;overflow:hidden;position:relative}
.map{display:block;width:100%;height:auto}
.map.placing{cursor:crosshair}
.map .pin{cursor:pointer}
.map text{font-family:var(--f);font-weight:700;fill:var(--muted);letter-spacing:.08em}
.place-banner{position:absolute;left:12px;right:12px;top:12px;background:var(--ink);color:var(--bg);font-size:14px;padding:8px 14px;border-radius:999px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.place-banner button{border:0;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
.spot-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.spot-head h3{font-size:20px;overflow-wrap:anywhere}
.avg{flex:none;text-align:center;background:var(--pink-soft);color:var(--pink-deep);border-radius:16px;padding:6px 12px;min-width:60px}
.avg b{display:block;font-size:24px;line-height:1.05;font-variant-numeric:tabular-nums}
.avg span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.rates{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;margin-top:12px;font-size:14.5px}
.rates .who{color:var(--muted);font-weight:700}
.prow{display:inline-flex;gap:3px;color:var(--ink)}
.pi{width:17px;height:21px}
.pi.off{opacity:.16}
details.more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{list-style:none;cursor:pointer;font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:6px;color:var(--blue)}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{width:16px;height:16px;transition:transform .15s}
details.more[open] summary svg{transform:rotate(180deg)}
.note{margin:12px 0 0;font-size:15px;background:var(--bg);padding:10px 12px;border-radius:12px}
.spot-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.spot-list{padding:4px 18px}
.spot-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.spot-row:last-child{border-bottom:0}
.spot-row strong{display:block;overflow-wrap:anywhere}
.spot-row small{color:var(--muted)}
.spot-row .sc{font-size:20px;font-weight:700;color:var(--pink-deep);font-variant-numeric:tabular-nums}

/* WISH */
.wish-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wish{background:var(--paper);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.wish .img{aspect-ratio:1;max-width:100%;background:var(--ice);display:grid;place-items:center;overflow:hidden}
.wish .img img{width:100%;height:100%;object-fit:cover}
.wish .img svg{width:40%}
.wish .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
.wish strong{overflow-wrap:anywhere;line-height:1.25}
.wish .price{color:var(--pink-deep);font-weight:700}
.wish a{color:var(--blue);font-size:13px;font-weight:700;overflow-wrap:anywhere}
.wish .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;align-items:center;flex-wrap:wrap}
.chip{border:0;background:var(--ice);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700}
.chip.on{background:var(--pink);color:var(--on-pink)}

/* PHOTOS */
.story{position:relative;aspect-ratio:3/4;max-width:100%;width:100%;background:var(--ink);overflow:hidden;border-radius:24px;user-select:none;-webkit-user-select:none}
.story img,.story .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.story .ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-weight:700;color:var(--ink)}
.story .ph svg{width:42%}
.bars{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:4px;z-index:2}
.bars span{flex:1;height:3px;background:rgb(255 255 255 / .45);border-radius:2px;overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:#fff}
.story .meta{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 18px;background:linear-gradient(transparent,rgb(0 0 0 / .55));color:#fff;z-index:2}
.story .meta .when{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
.story .meta .cap{font-size:24px;font-weight:700;line-height:1.15}
.story .zone{position:absolute;top:0;bottom:0;z-index:1;border:0;background:none}
.story .zone.l{left:0;width:35%}.story .zone.r{right:0;width:65%}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.days{display:flex;flex-direction:column;gap:12px}
.day-card{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:12px}
.day-card .thumb{aspect-ratio:1;max-width:100%;overflow:hidden;border-radius:14px;background:var(--pink-soft);display:grid;place-items:center}
.day-card .thumb img{width:100%;height:100%;object-fit:cover}
.day-card .thumb svg{width:60%}
.day-card strong{font-size:17px;display:block;overflow-wrap:anywhere}
.day-card small{color:var(--pink-deep);font-weight:700;font-size:13px}
.day-card p{margin:4px 0 0;font-size:14.5px;overflow-wrap:anywhere}
.empty{text-align:center;padding:24px 12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty svg{width:60px}

/* CALENDAR */
.cal-head{display:flex;justify-content:space-between;align-items:center}
.cal-head h3{font-size:21px}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:34px;height:34px;border:0;border-radius:50%;background:var(--ice);font-size:18px;line-height:1}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:12px;text-align:center}
.cal-grid .wd{font-size:12px;font-weight:700;color:var(--muted);padding-bottom:4px}
.day{position:relative;aspect-ratio:1;max-width:100%;border:0;background:none;font-variant-numeric:tabular-nums;font-size:15px;padding:0 0 8px;border-radius:50%}
.day.out{opacity:.3}
.day.today{color:var(--pink-deep);font-weight:700}
.day.sel{background:var(--ink);color:var(--bg)}
.day .dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:2px}
.day .dots i{width:5px;height:5px;border-radius:50%}
.day .melt{position:absolute;top:3px;right:3px;width:11px;height:11px;color:var(--pink-deep)}
.day .melt svg{width:100%;height:100%;display:block}
.day.sel .melt{color:var(--pink)}
.cal-foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);align-items:center;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.legend-item{display:inline-flex;align-items:center;gap:6px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.dayhead h3{font-size:19px}
.melt-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--pink);background:var(--pink-soft);color:var(--pink-deep);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.melt-btn svg{width:16px;height:16px}
.melt-btn.on{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
.ev-list{display:flex;flex-direction:column;margin-top:8px}
.ev{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.ev:last-child{border-bottom:0}
.ev .bar{align-self:stretch;border-radius:2px}
.ev strong{display:block;overflow-wrap:anywhere}
.ev small{color:var(--muted)}
.ev .tm{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

/* sheet */
.backdrop{position:absolute;inset:0;background:rgb(34 37 43 / .35);display:flex;align-items:flex-end;z-index:60}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding-block:20px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet,.fly{animation:none}.fly{display:none}}
.sheet h2{font-size:23px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
.field input:focus,.field textarea:focus{border-color:var(--sky);outline:none}
.field textarea{min-height:72px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate-in{display:flex;gap:4px}
.rate-in button{border:0;background:none;padding:2px;color:var(--ink)}
.rate-in .pi{width:26px;height:31px}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
.pick button[aria-pressed="true"]{border-color:var(--ink);background:var(--ice)}
.pick button small{font-weight:400;color:var(--muted);font-size:12px}
.col-sw{width:30px;height:30px;border:3px solid var(--paper);border-radius:50%;box-shadow:0 0 0 1px var(--line);padding:0}
.col-sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods button{border:1px solid var(--line);background:var(--paper);border-radius:18px;padding:12px 2px 10px;font-size:13px!important;transition:transform .15s;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700}
.moods button svg{width:46px;height:46px}
.moods button[aria-pressed="true"]{border-color:var(--ink);background:var(--ice)}
.newcal{display:flex;flex-direction:column;gap:10px;background:var(--bg);padding:12px;border-radius:16px}
.cal-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.avatar-pick{display:flex;align-items:center;gap:12px}
.avatar-pick .av{width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--ice);display:grid;place-items:center;flex:none;font-weight:700;font-size:22px;color:var(--blue)}
.avatar-pick .av img{width:100%;height:100%;object-fit:cover}
.widget-prev{display:flex;gap:14px;align-items:center}
.widget-prev .w{width:116px;height:116px;flex:none;border-radius:24px;overflow:hidden;position:relative;background:var(--ice)}

/* Seitenmenü von links */

.qlist{padding:4px 16px}

.qn{font-size:13px;font-weight:700;color:var(--muted);padding-top:2px;font-variant-numeric:tabular-nums}

.fs-want svg{width:14px;height:14px}
.fs-people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fs-p{border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fs-p.me{background:var(--ice)}.fs-p.pa{background:var(--pink-soft)}
.fs-p .who{font-size:12.5px;font-weight:700;color:var(--muted)}
.fs-p b{font-size:22px;font-variant-numeric:tabular-nums}
.fs-p b small{font-size:13px;color:var(--muted);font-weight:700}
.fs-p .dish{font-size:13.5px;overflow-wrap:anywhere}
.fs-visits{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.spot-row .sc.want{color:var(--pink-deep);width:22px;height:22px}
.spot-row .sc.want svg{width:100%;height:100%}
.price-pick button{padding:6px 10px;letter-spacing:.04em}
.score-in{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.score-in button{aspect-ratio:1;max-width:100%;border:1px solid var(--line);background:var(--paper);border-radius:50%;font-size:13.5px;font-weight:700;padding:0;font-variant-numeric:tabular-nums;color:var(--muted)}
.score-in button[aria-pressed="true"]{background:var(--pink-deep);border-color:var(--pink-deep);color:#fff}
.fs-form{display:flex;flex-direction:column;gap:12px;background:var(--bg);border-radius:16px;padding:12px}

/* Wünsche v2 */
.wl-hint{display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;color:var(--muted)}
.wl-hint svg{width:14px;height:14px;color:var(--pink-deep);flex:none}
.wl{display:flex;flex-direction:column;gap:10px}
.wl-item{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:10px}
.wl-item.fav{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.wl-img{width:88px;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;background:var(--ice);display:grid;place-items:center}
.wl-img img{width:100%;height:100%;object-fit:cover}
.wl-img svg{width:60%}
.wl-body{display:flex;flex-direction:column;gap:3px;min-width:0;padding-top:2px}
.wl-body strong{font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.wl-meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.wl-meta b{color:var(--pink-deep);font-size:15px}
.wl-body p{margin:0;font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.wl-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:4px}
.wl-foot a{color:var(--blue);font-weight:700;font-size:14px;text-decoration:none}
.wl-heart{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;color:var(--line);padding:9px;transition:transform .15s}
.wl-heart svg{width:100%;height:100%}
.wl-heart.on{color:var(--pink-deep);border-color:var(--pink);background:var(--pink-soft)}
.wl-heart:not(.ro):active{transform:scale(.88)}
.wl-heart.ro{border:0;background:none;width:30px;height:30px;padding:4px}
.wl-form-img{display:flex;gap:14px;align-items:center}

/* Date-Ideen v2 */
.idea-gen{display:flex;flex-direction:column;gap:12px}
.idea-out{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--pink);background:linear-gradient(180deg,var(--pink-soft),var(--paper) 70%)}
.idea-src{align-self:flex-start;font-size:12.5px;font-weight:700;color:var(--pink-deep);background:var(--paper);border-radius:999px;padding:2px 10px}
.idea-d{margin:0;color:var(--muted);font-size:15px}
.idea-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.idea-row:last-child{border-bottom:0}
.idea-main{display:flex;flex-direction:column;gap:3px;border:0;background:none;padding:0;text-align:left;min-width:0}
.idea-main strong{overflow-wrap:anywhere}
.idea-main small{color:var(--muted);font-size:13px}
.idea-main .fs-tags{margin-top:2px}

/* Kennenlernen v2 */
.k-todo{padding:14px 16px 6px;border-color:var(--pink)}
.k-item{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 0}
.k-item:last-child{border-bottom:0}
.k-q{display:flex;flex-direction:column;gap:2px;min-width:0}
.k-q strong{font-size:15.5px;font-weight:400;line-height:1.35;overflow-wrap:anywhere}
.k-todo .k-q strong{font-weight:700}
.k-q small{font-size:12.5px;color:var(--muted)}
.ki{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.ki svg{width:18px;height:18px}
.ki.ready{background:var(--pink-deep);color:#fff}
.ki.turn{background:var(--blue);color:#fff;font-weight:700;font-size:18px}
.ki.wait{background:#fdf1df;color:#b5781f}
.ki.open{border:2px dashed var(--line)}
.ki.done{background:var(--pink-soft);color:var(--pink-deep)}
.ch-count{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ch-count b{font-size:20px;color:var(--ink)}
.k-group{display:flex;flex-direction:column;gap:8px}
.k-gh{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.k-gh span{font-size:12px;background:var(--line);color:var(--ink);border-radius:999px;padding:0 8px;letter-spacing:0}
.k-list{padding:2px 16px}

/* Haustier: Schneelandschaft */
.pet-scene{background:radial-gradient(120% 55% at 78% 8%,rgb(255 244 232 / .9),rgb(255 244 232 / 0) 55%),linear-gradient(180deg,#c3d5e4 0%,#d9e5ee 38%,#e9eff4 58%,#f3f6f8 66%,#fafbfc 100%)}
.mtn-far{position:absolute;left:0;right:0;bottom:44%;width:100%;height:16%}
.mtn{position:absolute;left:0;right:0;bottom:33%;width:100%;height:30%}
.snowfloor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,#f8f9fb,#f2f5f8 60%,#eef2f6)}
.snowfloor svg{position:absolute;left:0;right:0;top:-14px;width:100%;height:28px}
.iceblocks{position:absolute;left:-2%;bottom:24%;width:30%;max-width:150px}
.drift{position:absolute;right:-3%;bottom:22%;width:32%;max-width:170px}
.snow{position:absolute;inset:0;width:100%;height:100%}

/* Menü-Hinweise */
.menu-btn{position:relative}
.menu-dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--pink-deep);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg);font-variant-numeric:tabular-nums;animation:dotin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes dotin{from{transform:scale(0)}}
.nav-l{flex:1;min-width:0}
.nav-b{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--pink-deep);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.drawer nav .yr-btn{margin-top:6px;background:linear-gradient(90deg,var(--pink-soft),var(--ice));font-weight:700;color:var(--pink-deep)}
.drawer nav .yr-btn svg{color:var(--pink-deep)}

/* Karte */
.map-wrap{position:relative}
.mapcard .map{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;display:block}
.mapcard .map:active{cursor:grabbing}
.mapcard .map.placing{cursor:crosshair}
.m-land{fill:#f3f1ec}.m-park{fill:#d4e7c6}.m-lake{fill:#a8d2ee}
.m-river{fill:none;stroke:#a8d2ee;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.rd-c,.rd,.mw-c,.mw,.br{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
.rd-c{stroke:#ddd6cc}.rd{stroke:#fff}.mw-c{stroke:#e2b25a}.mw{stroke:#f7d68c}.br{stroke:#fff}
.map[data-z="1"] .rd-c{stroke-width:2.6}.map[data-z="1"] .rd{stroke-width:1.4}.map[data-z="1"] .mw-c{stroke-width:3.6}.map[data-z="1"] .mw{stroke-width:2.2}.map[data-z="1"] .br{stroke-width:1.6}
.map[data-z="2"] .rd-c{stroke-width:4}.map[data-z="2"] .rd{stroke-width:2.6}.map[data-z="2"] .mw-c{stroke-width:5}.map[data-z="2"] .mw{stroke-width:3.4}.map[data-z="2"] .br{stroke-width:2.6}
.map[data-z="3"] .rd-c{stroke-width:6}.map[data-z="3"] .rd{stroke-width:4.4}.map[data-z="3"] .mw-c{stroke-width:7.5}.map[data-z="3"] .mw{stroke-width:5.6}.map[data-z="3"] .br{stroke-width:4.4}
.map[data-z="4"] .rd-c{stroke-width:9}.map[data-z="4"] .rd{stroke-width:7}.map[data-z="4"] .mw-c{stroke-width:11}.map[data-z="4"] .mw{stroke-width:8.5}.map[data-z="4"] .br{stroke-width:7}
.map .shield{fill:#fff;stroke:#d4a447;stroke-width:1.2}
.map .shield-t{font-family:var(--f);font-size:8.5px;font-weight:700;fill:#8a6a24;letter-spacing:0}
.map .ml{font-family:var(--f);paint-order:stroke;stroke:#f3f1ec;stroke-width:3px;stroke-linejoin:round;letter-spacing:0;pointer-events:none}
.map .ml-city{font-weight:700;fill:#2f2b35}
.map .ml-town{font-weight:700;fill:#5c5662}
.map .ml-dist{font-weight:700;fill:#8d8794;letter-spacing:.12em}
.map .ml-street{fill:#6d6873;font-style:italic}
.map .ml-water{fill:#3f7aa3;font-style:italic;stroke:#a8d2ee}
.map .ml-park{fill:#4f7a40;font-style:italic;stroke:#d4e7c6}
.map .ml-poi{fill:var(--pink-deep);font-weight:700}
.map .pin{cursor:pointer}
.map-ctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;background:rgb(255 255 255 / .94);border-radius:12px;box-shadow:0 2px 12px rgb(59 54 64 / .16);overflow:hidden}
.map-ctl button{width:42px;height:42px;border:0;background:none;font-size:22px;line-height:1;color:var(--ink)}
.map-ctl button+button{border-top:1px solid var(--line)}
.map-ctl button:disabled{opacity:.3;cursor:default}
.map-fit{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border:0;border-radius:12px;background:rgb(255 255 255 / .94);box-shadow:0 2px 12px rgb(59 54 64 / .16);display:grid;place-items:center;color:var(--blue)}
.map-fit svg{width:20px;height:20px}
.place-banner{right:62px}

/* Kiesel: Kopfbereich & Ringe */
.pet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pet-who{display:flex;flex-direction:column;min-width:0}
.pet-who .pet-name{font-size:28px;line-height:1.1}
.pet-mood{font-size:13.5px;color:var(--muted)}
.pet-lv{flex:none;display:inline-flex;align-items:center;gap:5px;background:rgb(255 255 255 / .85);border-radius:999px;padding:5px 12px 5px 8px;font-size:14px;font-weight:700;color:var(--ink);box-shadow:0 2px 8px rgb(59 54 64 / .08)}
.pet-lv svg{width:18px;height:18px;animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(18deg) scale(1.15)}}
.pet-xp{display:flex;align-items:center;gap:8px}
.pet-xp i{flex:1}
.pet-xp small{font-size:11.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.pet-xp b{background:linear-gradient(90deg,#f2c14e,#e9a24a)}
.rings{display:flex;justify-content:space-around;gap:6px;margin-top:6px}
.ring{display:flex;flex-direction:column;align-items:center;gap:3px;--rc:var(--blue)}
.r-clean{--rc:#5aa2d2}.r-joy{--rc:var(--pink-deep)}
.ring.low{--rc:#e0913a}
.ring-c{position:relative;width:60px;height:60px}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-svg .rt{fill:rgb(255 255 255 / .9);stroke:rgb(255 255 255 / .6);stroke-width:5}
.ring-svg .rv{fill:none;stroke:var(--rc);stroke-width:5;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;transition:stroke-dashoffset .9s cubic-bezier(.3,1.3,.5,1),stroke .3s}
.ring-ic{position:absolute;inset:13px;display:grid;place-items:center}
.ring-ic svg{width:100%;height:100%}
.ring-l{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.ring-l b{color:var(--ink);font-variant-numeric:tabular-nums}
.ring.low .ring-c{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(0)}10%{transform:rotate(-8deg)}20%{transform:rotate(7deg)}30%{transform:rotate(-4deg)}40%{transform:rotate(0)}}
.ring.bump .ring-c{animation:rpop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes rpop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.ring-pop{position:absolute;left:50%;top:-4px;transform:translateX(-50%);font-size:13px;font-weight:700;color:var(--rc);opacity:0;pointer-events:none;white-space:nowrap}
.ring-pop.go{animation:rise 1.2s ease-out}
@keyframes rise{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px)}}
.say{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:4;background:var(--paper);border-radius:18px;padding:8px 14px;font-size:14.5px;font-weight:700;box-shadow:0 6px 18px rgb(59 54 64 / .14);max-width:min(80%,280px);text-align:center;pointer-events:none}
.say::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--paper);transform:translateX(-50%) rotate(45deg);border-radius:3px}
.say.in{animation:sayin .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes sayin{from{transform:translateX(-50%) scale(.6);opacity:0}}
.pa-ic{background:var(--paper)}
.pa-ic svg{width:62%;height:62%}
.pet-act:hover .pa-ic svg,.pet-act:focus-visible .pa-ic svg{animation:jig .5s ease-in-out}
@keyframes jig{30%{transform:rotate(-10deg) scale(1.08)}60%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){.pet-lv svg,.ring.low .ring-c,.ring.bump .ring-c,.ring-pop.go,.say.in,.pet-act .pa-ic svg,.menu-dot{animation:none}.ring-svg .rv{transition:none}}

/* Herzen von Partner */
.love{position:absolute;inset:0;z-index:96;background:rgb(34 37 43 / .4);display:grid;place-items:center;padding:20px;animation:fade .2s}
.love.out{opacity:0;transition:opacity .25s}
.love-card{width:min(100%,340px);background:var(--paper);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:up .3s cubic-bezier(.3,1.4,.5,1)}
.love-card h2{font-size:22px;line-height:1.2}
.love-art{position:relative;width:100%;height:170px;background:radial-gradient(circle at 50% 60%,var(--pink-soft),var(--paper) 70%);border-radius:20px;overflow:hidden;display:grid;place-items:center}
.love-peng{width:150px;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-3deg) translateY(-3px)}}
.love-art.kiss .love-peng{animation:kissy .7s cubic-bezier(.3,1.6,.5,1) 2}
@keyframes kissy{40%{transform:scale(1.18) translateY(-8px)}}
.love-fx{position:absolute;inset:0;pointer-events:none}
.lh{position:absolute;bottom:-20px;color:var(--pink-deep);animation:lhup 2s ease-out forwards;opacity:.9}
.lh.big{color:var(--pink)}
.lh svg{width:100%;height:100%}
@keyframes lhup{to{transform:translate(var(--dx),-200px) scale(1.2);opacity:0}}
.love-acts{display:flex;gap:10px;margin-top:4px}
@media (prefers-reduced-motion:reduce){.love-peng,.lh{animation:none}}

/* Jahresrückblick */
.yr{position:absolute;inset:0;z-index:97;background:var(--ink);user-select:none;-webkit-user-select:none;overflow:hidden}
.yr .bars{top:calc(12px + env(safe-area-inset-top,0px));z-index:3}
.yr-x{position:absolute;right:12px;top:calc(22px + env(safe-area-inset-top,0px));z-index:4;width:38px;height:38px;border:0;border-radius:50%;background:rgb(255 255 255 / .7);font-size:22px;line-height:1;color:var(--ink)}
.yr-z{position:absolute;top:70px;bottom:0;z-index:2;border:0;background:none}
.yr-z.l{left:0;width:33%}.yr-z.r{right:0;width:67%}
.yr-slide{position:absolute;inset:0;display:grid;place-items:center;padding:70px max(28px,env(safe-area-inset-left,0px)) 40px}
.yr-in{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:340px;animation:yrin .6s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.yr-in button{pointer-events:auto;margin-top:12px}
@keyframes yrin{from{transform:translateY(24px);opacity:0}}
.yr-big{font-size:92px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;animation:bigin .8s cubic-bezier(.3,1.5,.5,1)}
@keyframes bigin{from{transform:scale(.4);opacity:0}}
.yr-l{margin:0;font-size:22px;font-weight:700;line-height:1.25}
.yr-sub{margin:0;font-size:16px;opacity:.75;line-height:1.4}
.yr-sub b{opacity:1}
.yr-k{margin:0;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.7}
.yr-h{font-size:34px;line-height:1.1}
.yr-q{font-size:22px;line-height:1.25}
.yr-note{margin:16px 0 0;font-size:13px;opacity:.55}
.yr-txt{margin:0;font-size:15px;opacity:.8}
.yr-peng{width:170px}.yr-pet{width:120px}
.yr-photo{width:200px;aspect-ratio:1;max-width:100%;border-radius:22px;overflow:hidden;border:5px solid #fff}
.yr-photo img{width:100%;height:100%;object-fit:cover}
.yr-ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:6px}
.yr-ans div{background:rgb(255 255 255 / .75);border-radius:16px;padding:10px;font-size:14.5px;text-align:left}
.yr-ans small{display:block;font-weight:700;opacity:.6;font-size:12px}
.s1{background:radial-gradient(circle at 50% 30%,#fff,var(--pink-soft) 70%);color:var(--ink)}
.s2{background:linear-gradient(160deg,var(--sky),#c6d7e5);color:var(--on-sky)}
.s3{background:linear-gradient(160deg,#fbf0e4,#f3dcc2);color:#6b4a2a}
.s4{background:linear-gradient(160deg,var(--deep),#d9d0e0);color:var(--deep-ink)}
.s5{background:linear-gradient(160deg,var(--pink),var(--pink-deep));color:#fff}
.s6{background:linear-gradient(180deg,#d9e5ee,#f6f8fa);color:var(--ink)}
.s7{background:linear-gradient(160deg,var(--pink-soft),#f9efe9);color:var(--ink)}
.s8{background:radial-gradient(circle at 50% 30%,#4a4450,var(--ink));color:var(--bg)}
@media (prefers-reduced-motion:reduce){.yr-in,.yr-big{animation:none}}

/* Kiesel: Vollbild-Welt & Schlafen */
#p-pet .pet-stage{position:absolute;inset:0;flex:none;z-index:1}
#p-pet .pet-hud,#p-pet .pet-dock{z-index:3}
#p-pet .pet-dock{margin-top:auto}
.pet-dock .pet-last{position:static;margin:0;padding:0 16px 2px;text-shadow:0 1px 0 rgb(255 255 255 / .8)}
.pet-stage .snow{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
#p-pet.three-on .mtn,#p-pet.three-on .mtn-far,#p-pet.three-on .snowfloor,#p-pet.three-on .iceblocks,#p-pet.three-on .drift{display:none}
#p-pet.three-on .pet-scene{background:linear-gradient(180deg,#8fb0cc 0%,#b5cbdd 30%,#d4e1eb 55%,#e1e9f0 70%,#e1e9f0 100%)}
#p-pet.three-on .pet-scene::after{content:"";position:absolute;inset:0;background:radial-gradient(90% 40% at 80% 6%,rgb(255 246 234 / .75),transparent 60%)}
#p-pet.asleep.three-on .pet-scene{background:linear-gradient(180deg,#5d7591 0%,#8ea6bf 35%,#c3d1de 60%,#e1e9f0 72%)}
#p-pet .pet-scene{transition:background 1.5s}
.pet-bar{grid-template-columns:repeat(5,1fr);gap:4px}
.pa-ic{width:clamp(48px,13vw,58px)}
.pet-act{font-size:12.5px}
.pa-l{white-space:nowrap}
#p-pet.asleep .pet-act:not([data-act="sleep"]){opacity:.4}
#p-pet.asleep .pet-act[data-act="sleep"] .pa-ic{box-shadow:0 0 0 3px #f2c14e,0 4px 16px rgb(59 54 64 / .12)}
.zz{position:absolute;font-weight:700;font-size:22px;color:#fff;text-shadow:0 1px 4px rgb(29 44 60 / .45);animation:zz 2.6s ease-out forwards;pointer-events:none}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(26px,-90px) scale(1.4) rotate(12deg)}}
.pet-flat.gone{opacity:0;transition:opacity .6s}
.moods button[aria-pressed="true"] svg{transform:scale(1.08)}
.moods button:active{transform:scale(.95)}

  <div class="chapters">${CHAPTERS.map(c=>{const i=curQ(c),done=c.qs.length===i;
   return `<button class="chapter ${c.cls}" data-ch="${c.id}">${chIcon(c)}<span class="ch-txt"><strong>${c.t}</strong><small>${done?'Geschafft! Alle Fragen aufgedeckt.':'Frage '+(i+1)+' von '+c.qs.length+' · '+kText(kStatus(kq(c.id,i)),PN)}</small>
    <span class="k-dots" aria-hidden="true">${c.qs.map((_,k)=>`<i class="${k<i?'on':k===i?'now':''}"></i>`).join('')}</span></span><span class="ch-go" aria-hidden="true">›</span></button>`}).join('')}</div>`;

 const c=CHAPTERS.find(x=>x.id===knowCh),ci=curQ(c),n=c.qs.length;

function knowSheet(c,i){
 const id=c.id+'-'+i,P=esc(S.partner.name);let editing=false;
 const body=()=>{const a=S.know[id]||{},s=kStatus(a);
  if(s==='open'||s==='turn'||editing)return `${s==='turn'&&!editing?`<div class="kwait turn">${lockSvg}<p><b>${P} hat schon geantwortet.</b> Schreib deine Antwort, dann könnt ihr beide aufdecken.</p></div>`:''}

  if(s==='wait')return `<div class="bubble me" style="max-width:100%"><small>Deine Antwort</small>${esc(a.me)}</div>
   <div class="kwait">${clockSvg}<div><b>Warten auf ${P}</b><p>Sobald ${P} geantwortet hat, deckt ihr eure Antworten gemeinsam auf.</p></div></div>
   <div class="test-box"><strong>Nur im Prototyp</strong><span class="muted" style="font-size:14px">Tu so, als hätte ${P} gerade geantwortet.</span><button class="btn" id="k-sim" style="align-self:flex-start">${P} antwortet</button></div>
   <div class="sheet-actions"><button class="btn ghost" id="k-edit">Antwort ändern</button><button class="btn pink" data-close>Schließen</button></div>`;
  const open=s==='done';
  return `<div class="reveal ${open?'open':''}" id="k-rev">
    <div class="rcard"><div class="rin"><div class="rback me">${lockSvg}<span>${esc(S.me.name)}</span></div><div class="rfront me"><small>${esc(S.me.name)}</small><p>${esc(a.me)}</p></div></div></div>
    <div class="rcard"><div class="rin"><div class="rback p">${lockSvg}<span>${P}</span></div><div class="rfront p"><small>${P}</small><p>${esc(a.partner)}</p></div></div></div></div>
   ${open?'':'<p class="muted" style="margin:0;font-size:14.5px;text-align:center">Ihr habt beide geantwortet.</p>'}
   <div class="sheet-actions" id="k-acts">${open?'<button class="btn pink" data-close>Schließen</button>':'<button class="btn ghost" data-close>Später</button><button class="btn pink" id="k-open">Aufdecken</button>'}</div>`};
 openSheet(`<span class="label">${c.t} · Frage ${i+1}</span><h2 class="kq">${esc(c.qs[i])}</h2><div id="k-body" class="kbody"></div>`,(sh,close)=>{
  const B=sh.querySelector('#k-body');
  const redraw=()=>{B.innerHTML=body();wire()};
  const wire=()=>{
   B.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);
   const send=B.querySelector('#k-send');if(send)send.onclick=()=>{const v=B.querySelector('#k-in').value.trim();if(!v){toast('Schreib erst deine Antwort');return}
    S.know[id]={...(S.know[id]||{}),me:v,ex:false};editing=false;did();save();redraw();renderKnow();toast(S.know[id].partner?'Ihr könnt jetzt aufdecken':'Gespeichert. Jetzt ist '+S.partner.name+' dran.')};
   const sim=B.querySelector('#k-sim');if(sim)sim.onclick=()=>{S.know[id].partner=c.pa[i];save();redraw();renderKnow();toast(S.partner.name+' hat geantwortet')};
   const ed=B.querySelector('#k-edit');if(ed)ed.onclick=()=>{editing=true;redraw();B.querySelector('#k-in').focus()};
   const op=B.querySelector('#k-open');if(op)op.onclick=()=>{S.know[id].revealed=true;save();B.querySelector('#k-rev').classList.add('open');
    B.querySelector('#k-rev').nextElementSibling.remove();const acts=B.querySelector('#k-acts');acts.innerHTML='<button class="btn pink" data-close>Schließen</button>';acts.querySelector('[data-close]').onclick=close;renderKnow();if(i+1<c.qs.length)setTimeout(()=>toast('Frage '+(i+2)+' ist jetzt freigeschaltet'),900);else setTimeout(()=>toast('Kapitel geschafft!'),900)};
  };
  redraw();
 });
}

function dayViewer(d){if(!d||!d.src)return;

 $('#app').appendChild(o);const img=o.querySelector('img'),st=o.querySelector('.lb-stage');let z=1,tx=0,ty=0;
 const apply=()=>{img.style.transform=`translate(${tx}px,${ty}px) scale(${z})`};
 const clampT=()=>{const mx=(st.clientWidth*(z-1))/2,my=(st.clientHeight*(z-1))/2;tx=Math.max(-mx,Math.min(mx,tx));ty=Math.max(-my,Math.min(my,ty))};

 st.addEventListener('pointerdown',e=>{st.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z}}
  else{const now=Date.now();if(now-last<300){z=z>1?1:2.5;tx=ty=0;img.style.transition='transform .25s';apply();setTimeout(()=>img.style.transition='',260)}last=now}});

  if(pts.size===2&&pinch){const [a,b]=[...pts.values()];z=Math.max(1,Math.min(5,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));clampT();apply()}});

/* ================= SERIE & TAGESAUFGABE ================= */
const TASKS=[
 ['Schickt euch ein Foto von eurem Mittagessen.','Foto'],
 ['Sag deinem Schatz eine Sache, die du heute an ihm magst.','Nachricht'],
 ['Hört euch beide denselben Song an und schreibt, woran er euch erinnert.','Musik'],
 ['Schickt euch ein Selfie mit eurem lustigsten Gesicht.','Foto'],
 ['Plant gemeinsam euer nächstes Date.','Planen'],
 ['Erzählt euch den schönsten Moment eurer Woche.','Reden'],
 ['Schickt euch eine Sprachnachricht, nur „Gute Nacht“.','Nachricht'],
 ['Sucht euch einen neuen Foodspot für die Merkliste aus.','Foodspots'],
 ['Schreibt euch drei Dinge, für die ihr heute dankbar seid.','Reden'],
 ['Schickt euch ein Foto von dem, was ihr gerade seht.','Foto'],
 ['Denkt euch zusammen einen Spitznamen für Kiesel aus.','Kiesel'],
 ['Erinnert euch: Was war euer erstes Gespräch?','Reden'],
 ['Tragt einen neuen Wunsch auf eure Wunschliste ein.','Wünsche'],
 ['Schickt euch ein Foto aus eurer Kindheit.','Foto']];
const todayIso=()=>iso(new Date());
const dayNo=()=>Math.floor(today0().getTime()/864e5);
const todayTask=()=>TASKS[(dayNo()%TASKS.length+TASKS.length)%TASKS.length];
const bothOn=d=>{const a=(S.act||{})[d];return !!(a&&a.me&&a.partner)};
function streak(){let d=new Date(today0());if(!bothOn(iso(d)))d.setDate(d.getDate()-1);let n=0;while(bothOn(iso(d))&&n<5000){n++;d.setDate(d.getDate()-1)}return n}
function did(){if(!S.connected)return;const t=todayIso();S.act=S.act||{};const was=bothOn(t);S.act[t]={...(S.act[t]||{}),me:true};
 Object.keys(S.act).sort().slice(0,-120).forEach(k=>delete S.act[k]);
 if(!was&&bothOn(t)){const n=streak();setTimeout(()=>{toast(`Serie: ${n} ${n===1?'Tag':'Tage'} am Stück! Weiter so.`);bumpStreak()},700)}
 renderStreakChip()}
const crystal=`<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5"/><path d="M9.6 4.2 12 6.4l2.4-2.2M9.6 19.8 12 17.6l2.4 2.2M4.3 10.6l3.1-.9-.8-3.1M19.7 13.4l-3.1.9.8 3.1M4.3 13.4l3.1.9-.8 3.1M19.7 10.6l-3.1-.9.8-3.1"/></g></svg>`;
function renderStreakChip(){const b=$('#streakBtn');if(!b)return;b.hidden=!S.connected||!S.loggedIn;const n=streak(),mine=!!((S.act||{})[todayIso()]||{}).me;
 b.innerHTML=`${crystal}<b>${n}</b>`;b.onclick=todaySheet;b.classList.toggle('todo',!mine);b.setAttribute('aria-label',`Eure Serie: ${n} Tage. ${mine?'Heute schon dabei.':'Heute noch offen.'} Kiesels Aufgabe ansehen`)}
function bumpStreak(){const b=$('#streakBtn');if(!b||reduced())return;b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}
function todaySheet(){
 const t=todayIso(),n=streak(),task=todayTask(),ts=(S.tasks||{})[t]||{},P=esc(S.partner.name);
 const wd=['So','Mo','Di','Mi','Do','Fr','Sa'];const week=[];for(let i=6;i>=0;i--){const d=new Date(today0());d.setDate(d.getDate()-i);const k=iso(d),a=(S.act||{})[k]||{};week.push({d,k,a})}

 function resize(){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;const fit=1.75,tan=Math.tan(cam.fov*Math.PI/360);let d=fit/2/tan;if(cam.aspect<.9)d/=cam.aspect/.9;cam.position.set(0,.95+d*.18,d);cam.lookAt(0,.55,0);cam.updateProjectionMatrix()}

  {c:'s5',h:big(hearts,'Herzen und Küsse verschickt','Pinguine zeigen ihre Liebe gern. Ihr auch.')},
  {c:'s6',h:`<div class="yr-pet">${penguin()}</div>${big('Stufe '+petLevel(),esc(S.pet.name)+' ist mit euch gewachsen','Danke fürs Füttern, Baden und Kuscheln.')}`},
  {c:'s7',h:day?`<p class="yr-k">Euer schönster Tag</p>${day.src?`<div class="yr-photo"><img src="${day.src}" alt=""></div>`:''}<h2 class="yr-h">${esc(day.title)}</h2><p class="yr-sub">${fmt(day.date)}</p>${day.text?`<p class="yr-txt">${esc(day.text)}</p>`:''}`:big('♥','Euer Jahr','Tragt eure schönsten Tage bei den Erinnerungen ein.')},
  {c:'s8',h:`<div class="yr-peng">${kissMark()}</div><h2 class="yr-h">Auf euer nächstes Jahr</h2><p class="yr-sub">Pinguine bleiben ein Leben lang zusammen. Klingt nach einem Plan.</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn" data-yr-close>Schließen</button><button class="btn pink" data-yr-share>Als Story teilen</button></div>`}];
 const o=document.createElement('div');o.className='yr';o.setAttribute('role','dialog');o.setAttribute('aria-label','Jahresrückblick');
 o.innerHTML=`<div class="bars">${slides.map(()=>'<span><i></i></span>').join('')}</div><button class="yr-x" data-yr-close aria-label="Schließen">×</button><div class="yr-slide" id="yrSlide"></div><button class="yr-z l" aria-label="Zurück"></button><button class="yr-z r" aria-label="Weiter"></button>`;
 $('#app').appendChild(o);let i=0,t=0,hold=false,last=performance.now(),raf=0;const DUR=5500;
 const show=k=>{i=Math.max(0,Math.min(slides.length-1,k));t=0;const sl=o.querySelector('#yrSlide');sl.className='yr-slide '+slides[i].c;sl.innerHTML=`<div class="yr-in">${slides[i].h}</div>`;
  o.querySelectorAll('.bars i').forEach((b,j)=>b.style.width=(j<i?100:0)+'%');sl.querySelectorAll('[data-yr-close]').forEach(b=>b.onclick=close);sl.querySelectorAll('[data-yr-share]').forEach(b=>b.onclick=()=>{close();yearStory()})};
 const close=()=>{cancelAnimationFrame(raf);o.remove()};
 const tick=now=>{raf=requestAnimationFrame(tick);const dt=now-last;last=now;if(hold)return;t+=dt;const b=o.querySelectorAll('.bars i')[i];if(b)b.style.width=Math.min(100,t/DUR*100)+'%';if(t>=DUR&&i<slides.length-1)show(i+1)};
 let downAt=0;o.addEventListener('pointerdown',e=>{if(e.target.closest('button:not(.yr-z)'))return;hold=true;downAt=Date.now()});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>o.addEventListener(ev,()=>{hold=false}));
 o.querySelector('.yr-z.l').onclick=()=>{if(Date.now()-downAt<350)show(i-1)};o.querySelector('.yr-z.r').onclick=()=>{if(Date.now()-downAt<350){if(i===slides.length-1)close();else show(i+1)}};
 o.querySelector('.yr-x').onclick=close;document.addEventListener('keydown',function k(e){if(!o.isConnected){document.removeEventListener('keydown',k);return}if(e.key==='Escape')close();if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
 show(0);raf=requestAnimationFrame(tick);
}

/* ================= NAV ================= */
const PAGES=[['home','Start','home'],['question','Kennenlernen','q'],['idea','Date-Ideen','idea'],['pet','Euer Pinguin','pet'],['food','Foodspots','food'],['wish','Wünsche','wish'],['photo','Erinnerungen','photo'],['cal','Kalender','cal']];
let view='home',menuOpen=false;
function closeMenu(){menuOpen=false;document.querySelectorAll('.drawer,.drawer-scrim').forEach(x=>x.remove());$('#menuBtn').setAttribute('aria-expanded','false')}
function openMenu(){if(menuOpen)return closeMenu();menuOpen=true;$('#menuBtn').setAttribute('aria-expanded','true');
 const mini=(p)=>`<span>${p.avatar?`<img src="${p.avatar}" alt="">`:esc((p.name||'?').charAt(0).toUpperCase())}</span>`;
 const days=Math.floor((new Date()-parse(S.since))/864e5);
 const d=document.createElement('aside');d.className='drawer';d.setAttribute('aria-label','Menü');
 d.innerHTML=`<div class="drawer-head"><span class="logo"><span class="peek">${kissMark()}</span><b>Ping<span>paar</span></b></span><button class="drawer-x" id="drawerX" aria-label="Menü schließen">×</button></div>
  ${S.connected?`<div class="drawer-couple"><span class="mini">${mini(S.me)}${mini(S.partner)}</span><span>${esc(S.me.name)} &amp; ${esc(S.partner.name)} · ${days.toLocaleString('de-DE')} Tage</span></div>`:''}
  <nav>${PAGES.map(([k,l,ic])=>{const at=attention(),b=k==='question'?at.question:k==='pet'&&at.pet?'!':0;return `<button data-go="${k}" ${k===view?'aria-current="page"':''}>${svgI(ic)}<span class="nav-l">${l}</span>${b?`<span class="nav-b">${b}</span>`:''}</button>`}).join('')}
   <button class="yr-btn" id="menuYr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4zM18.5 15l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9zM5.5 15l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7z"/></svg><span class="nav-l">Jahresrückblick ${new Date().getFullYear()}</span></button>
</nav>
  <button class="set" id="menuSet">${svgI('set')}Profil & Einstellungen</button>`;
 const sc=document.createElement('div');sc.className='drawer-scrim';sc.onclick=closeMenu;$('#app').appendChild(sc);$('#app').appendChild(d);
 d.querySelector('#drawerX').onclick=closeMenu;d.querySelector('#menuYr').onclick=()=>{closeMenu();yearReview()};d.querySelector('#menuSet').onclick=()=>{closeMenu();settingsSheet()};
 const cur=d.querySelector('[aria-current]')||d.querySelector('nav button');cur&&cur.focus({preventScroll:true})}
$('#menuBtn').onclick=openMenu;
function go(k){closeMenu();view=k;document.querySelectorAll('.pager .page').forEach(s=>{s.hidden=s.id!=='p-'+k});const pg=$('#p-'+k);if(pg)pg.scrollTop=0;
 if(k==='pet')renderPet();if(k==='question')renderKnow();if(k==='photo'){sp=0}
 if(P3){if(k==='pet')P3.start();else P3.stop()}
 if(k==='pet'){snowStart();setTimeout(()=>view==='pet'&&petSay(),900)}else snowStop()
 updateBadges()}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(g.dataset.go);const a=e.target.closest('[data-av]');if(a){avTarget=a.dataset.av;$('#avUp').click()}if(e.target.closest('[data-invite]')){document.querySelectorAll('.backdrop').forEach(b=>b.remove());sheetOpen=false;inviteSheet()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen)closeMenu()});

$('#logoPeng').innerHTML=kissMark();

function renderAll(){renderHome();renderKnow();renderIdea();renderPet();renderFood();renderWish();renderPhoto();renderCal();updateBadges();renderStreakChip()}
{const sp=document.getElementById('splash');if(sp){sp.onclick=()=>sp.classList.add('skip');setTimeout(()=>sp.remove(),3200)}}
renderAll();
if(!sb)showOnb('setup');
else{
 const qp=new URLSearchParams(location.search).get('code');if(qp){setPendingCode(qp.toUpperCase());history.replaceState(null,'',location.pathname+location.hash)}
 let recovering=/type=recovery/.test(location.hash);
 sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>{
  if(ev==='PASSWORD_RECOVERY'){recovering=true;ME=session&&session.user;showOnb('newpw');return}
  if(ev==='SIGNED_OUT'||!session)return;
  if(recovering)return;
  if(ev==='SIGNED_IN'||ev==='INITIAL_SESSION')enter(session)},0)});
 sb.auth.getSession().then(({data})=>{if(!data.session&&!recovering)showOnb('welcome')});
 window.addEventListener('pagehide',()=>{if(COUPLE)doPush().catch(()=>{})});
}
})();
